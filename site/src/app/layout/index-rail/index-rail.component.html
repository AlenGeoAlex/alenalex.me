<nav aria-label="Catalog index"
  class="sticky top-0 z-10 flex items-center gap-3 overflow-x-auto px-[clamp(1rem,3vw,2.5rem)] py-2 scrollbar-none
         max-md:glass max-md:border-x-0 max-md:border-t-0
         md:row-span-2 md:h-dvh md:flex-col md:items-stretch md:gap-10 md:overflow-visible md:border-r md:border-rule md:px-3 md:py-6">
  <a routerLink="/" aria-label="alenalex.me, home" class="hidden px-2 no-underline md:block">
    <span class="cat text-[1.05rem] tracking-[0.12em]">ALX</span>
  </a>
  <ol class="m-0 flex list-none gap-1 p-0 md:grid md:gap-1.5">
    @for (section of sections; track section.no) {
      <li>
        <a [routerLink]="section.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: section.path === '/' }"
          ariaCurrentWhenActive="page"
          class="group grid grid-cols-[28px_auto] items-center gap-x-1.5 border border-transparent py-1 pr-2 pl-1 whitespace-nowrap no-underline transition-colors
                 hover:text-ink md:grid-cols-[36px_1fr] md:px-2 md:py-2 [&.active]:text-ink">
          <app-section-object [name]="section.object" [size]="36"
            class="row-span-2 w-7! opacity-55 transition-[opacity,transform] duration-300 ease-out-expo group-hover:-translate-y-0.5 group-hover:-rotate-3 group-hover:opacity-100 group-[.active]:opacity-100 md:w-9!" />
          <span class="cat text-[0.72rem] text-ink-2 group-[.active]:text-signal">{{ section.no }}</span>
          <span class="text-xs">{{ section.label }}</span>
        </a>
      </li>
    }
  </ol>

  <button type="button" (click)="palette.open()" aria-label="Search posts and series"
    class="ml-auto flex shrink-0 items-center gap-2 border border-rule px-2 py-1.5 text-xs text-ink-3 transition-colors hover:border-ink-3 hover:text-ink
           md:mt-auto md:ml-0 md:px-2.5 md:py-2">
    <svg viewBox="0 0 16 16" aria-hidden="true" class="size-3.5 fill-none stroke-current stroke-[1.4]"><circle cx="7" cy="7" r="4.5" /><path d="m10.5 10.5 3.5 3.5" /></svg>
    <span class="hidden md:inline">search</span>
    <kbd class="ml-auto hidden border border-rule px-1 text-[0.65rem] md:inline">/</kbd>
  </button>
</nav>
