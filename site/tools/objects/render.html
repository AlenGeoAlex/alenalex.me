<!doctype html>
<meta charset="utf-8">
<title>catalog objects</title>
<style>body{margin:0;background:#0a0a0a;color:#eee;font:12px monospace}canvas{display:inline-block;margin:8px;background:#0a0a0a}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<script type="module">
// One object per section of the site, tinted with that section's colour.
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const HUE = { white: 0xf2f0ea, red: 0xe5412f, yellow: 0xf2c230, cobalt: 0x2f6fe8 };
const SIZE = 512;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const pmrem = new THREE.PMREMGenerator(renderer);
const envMap = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;

function acrylic(hue) {
  const white = hue === HUE.white;
  return new THREE.MeshPhysicalMaterial({
    color: hue, metalness: 0, roughness: white ? 0.06 : 0.18, transmission: white ? 0.55 : 0.82, thickness: 0.9, ior: 1.49,
    attenuationColor: hue, attenuationDistance: 1.1, clearcoat: 1, clearcoatRoughness: 0.08,
    iridescence: 0.25, iridescenceIOR: 1.3, envMapIntensity: white ? 1.8 : 1.15, specularIntensity: 1,
    transparent: true, opacity: 0.96,
  });
}
function edges(geo, opacity = 0.75, threshold = 20) {
  return new THREE.LineSegments(new THREE.EdgesGeometry(geo, threshold),
    new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity }));
}
function piece(geo, hue, edgeOpacity) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(geo, acrylic(hue)));
  g.add(edges(geo, edgeOpacity));
  return g;
}
const rbox = (w, h, d) => new THREE.BoxGeometry(w, h, d, 1, 1, 1);

const OBJECTS = {
  // ALX 000, home: a disc half out of its sleeve
  index() {
    const g = new THREE.Group();
    const sleeve = piece(rbox(1.7, 1.7, 0.08), HUE.white, 0.9);
    sleeve.position.set(-0.3, 0, 0.06);
    const discGeo = new THREE.CylinderGeometry(0.78, 0.78, 0.04, 96);
    const disc = piece(discGeo, HUE.white, 0.5);
    disc.rotation.x = Math.PI / 2;
    disc.position.set(0.42, 0, -0.07);
    for (let r = 0.25; r < 0.76; r += 0.07) {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.0035, 6, 128),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 }));
      ring.position.set(0.42, 0, -0.045);
      g.add(ring);
    }
    g.add(disc, sleeve);
    return g;
  },
  // ALX 010, writing: a fanned stack of sheets
  writing() {
    const g = new THREE.Group();
    [0, 1, 2, 3].forEach((i) => {
      const s = piece(rbox(1.25, 1.65, 0.05), HUE.red, 0.85);
      s.position.set(i * 0.14 - 0.2, i * 0.06, -i * 0.16);
      s.rotation.z = (i - 1.5) * 0.09;
      g.add(s);
    });
    return g;
  },
  // ALX 020, work: a 2×2×2 lattice of blocks
  work() {
    const g = new THREE.Group();
    for (const x of [-1, 1]) for (const y of [-1, 1]) for (const z of [-1, 1]) {
      const b = piece(rbox(0.62, 0.62, 0.62), HUE.yellow, 0.8);
      b.position.set(x * 0.37, y * 0.37, z * 0.37);
      g.add(b);
    }
    return g;
  },
  // ALX 030, guestbook: a rubber stamp
  guestbook() {
    const g = new THREE.Group();
    const pad = piece(new THREE.CylinderGeometry(0.75, 0.75, 0.22, 96), HUE.cobalt, 0.8);
    pad.position.y = -0.45;
    const neck = piece(new THREE.CylinderGeometry(0.22, 0.32, 0.55, 64), HUE.cobalt, 0.6);
    neck.position.y = -0.06;
    const knob = piece(new THREE.SphereGeometry(0.42, 64, 32), HUE.cobalt, 0.0);
    knob.position.y = 0.45;
    g.add(pad, neck, knob);
    return g;
  },
  // ALX 040, now: an hourglass
  now() {
    const pts = [];
    for (let i = 0; i <= 40; i++) {
      const t = i / 40, y = t * 1.8 - 0.9;
      pts.push(new THREE.Vector2(0.08 + 0.55 * Math.pow(Math.abs(y) / 0.9, 1.6), y));
    }
    const glass = piece(new THREE.LatheGeometry(pts, 96), HUE.white, 0.0);
    const capGeo = new THREE.CylinderGeometry(0.75, 0.75, 0.1, 96);
    const top = piece(capGeo, HUE.white, 0.85); top.position.y = 0.95;
    const bot = piece(capGeo, HUE.white, 0.85); bot.position.y = -0.95;
    const sand = new THREE.Mesh(new THREE.ConeGeometry(0.42, 0.38, 64), acrylic(HUE.red));
    sand.position.y = -0.7;
    const g = new THREE.Group();
    g.add(sand, glass, top, bot);
    return g;
  },
  // a single lit lamp, used for live status
  signal() {
    const g = new THREE.Group();
    const base = piece(rbox(1.1, 0.24, 1.1), HUE.white, 0.85);
    base.position.y = -0.45;
    const dome = piece(new THREE.SphereGeometry(0.5, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2), HUE.red, 0.0);
    dome.position.y = -0.33;
    g.add(base, dome);
    return g;
  },
};

async function render(name) {
  const scene = new THREE.Scene();
  scene.environment = envMap;
  const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 5, 4);
  const rim = new THREE.DirectionalLight(0xffffff, 1.4); rim.position.set(-4, 2, -3);
  scene.add(key, rim, new THREE.AmbientLight(0xffffff, 0.25));
  const obj = OBJECTS[name]();
  obj.rotation.set(0.42, name === 'index' ? 0.55 : -0.62, 0);
  scene.add(obj);
  const box = new THREE.Box3().setFromObject(obj);
  const c = box.getCenter(new THREE.Vector3()); obj.position.sub(c);
  const r = box.getBoundingSphere(new THREE.Sphere()).radius;
  const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
  cam.position.set(0, 0, r / Math.sin((30 * Math.PI) / 360) * 1.04);
  cam.lookAt(0, 0, 0);
  renderer.render(scene, cam);
  const blob = await new Promise((ok) => renderer.domElement.toBlob(ok, 'image/png'));
  const img = new Image(); img.src = URL.createObjectURL(blob); img.width = 160; img.title = name;
  document.body.append(img);
  await fetch('/save/' + name, { method: 'POST', body: blob });
}
for (const name of Object.keys(OBJECTS)) await render(name);
document.title = 'done';
</script>
