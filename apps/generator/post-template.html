<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{PAGE_TITLE}}</title>
        <meta name="description" content="{{EXCERPT}}" />
        <meta property="og:title" content="{{PAGE_TITLE}}" />
        <meta property="og:description" content="{{EXCERPT}}" />
        <meta property="og:type" content="article" />
        <meta
            property="og:url"
            content="https://alenalex.me/writing/{{SLUG}}/"
        />
        <meta
            property="og:image"
            content="{{OG_IMAGE_URL}}"
        />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="{{PAGE_TITLE}}" />
        <meta name="twitter:description" content="{{EXCERPT}}" />
        <link rel="canonical" href="https://alenalex.me/writing/{{SLUG}}/" />

        <link rel="stylesheet" href="/styles/tokens.css" />
        <link rel="stylesheet" href="/styles/base.css" />
        <link rel="stylesheet" href="/styles/post.css" />

        <link
            id="prism-dark"
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/prismjs@1/themes/prism-tomorrow.min.css"
        />
        <link
            id="prism-light"
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/prismjs@1/themes/prism-solarizedlight.min.css"
            disabled
        />
    </head>
    <body>
        <div class="post-page" data-slug="{{SLUG}}">
            <div
                class="post-draft-banner"
                id="draft-banner"
                style="display: none"
            >
                [DRAFT] {{HASH}} · not published · previewing github@<span
                    id="preview-sha"
                ></span>
            </div>

            <article class="post-content-wrap">
                <span class="post-icon">{{ICON}}</span>
                <h1 class="post-title">{{TITLE}}</h1>

                <div class="post-byline">
                    <span>{{DATE}}</span>
                    <span class="post-sb-sep">·</span>
                    <span>{{HASH}}</span>
                    <span class="post-sb-sep">·</span>
                    <div class="post-byline-tags">
                        {{TAGS_HTML}}
                    </div>
                </div>

                <div class="post-body">{{CONTENT_HTML}}</div>

                <div class="post-revisions">
                    <button class="post-revisions-toggle" id="revisions-toggle">
                        <span class="post-revisions-chevron">›</span>
                        revisions (<span id="revisions-count">…</span>)
                    </button>
                    <div class="post-revisions-list" id="revisions-list"></div>
                </div>
            </article>
        </div>
        
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/prism.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-csharp.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-rust.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-docker.min.js"></script>

        <script src="/src/config.js"></script>
        <script src="/src/layout.js"></script>
        <script src="/src/post.js"></script>

        <script>
            mountPostLayout({ hash: "{{HASH}}", date: "{{DATE}}" });

            (function () {
                const sha = new URLSearchParams(window.location.search).get(
                    "preview",
                );
                if (sha) {
                    const banner = document.getElementById("draft-banner");
                    const shaEl = document.getElementById("preview-sha");
                    if (banner) banner.style.display = "block";
                    if (shaEl) shaEl.textContent = sha;
                }
            })();
        </script>
    </body>
</html>
