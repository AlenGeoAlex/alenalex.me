<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>~ · Alen Alex</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="shortcut icon" href="/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />
        <meta name="description" content="Hey there! I am Alen Alex, A simple human and a software engineer who adores to explore technology.">
        <meta property="og:type" content="website">
        <meta property="og:title" content="Alen Alex | Portfolio">
        <meta property="og:description" content="Hey there! I am Alen Alex, A simple human and a software engineer who adores to explore technology.">
        <meta property="og:url" content="https://alenalex.me">
        <meta property="og:image" content="https://assets.alenalex.me/assets/hotlink-ok/default_og.png">
        <meta property="og:site_name" content="Alen Alex | Portfolio">
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="Alen Alex | Portfolio">
        <meta name="twitter:description" content="Hey there! I am Alen Alex, A simple human and a software engineer who adores to explore technology.">
        <meta name="twitter:image" content="https://assets.alenalex.me/assets/hotlink-ok/default_og.png">


        <script src="src/config.js"></script>
        <script src="src/layout.js"></script>
        <script src="src/writings.constants.js"></script>

        <link rel="stylesheet" href="styles/tokens.css" />
        <link rel="stylesheet" href="styles/base.css" />
        <link rel="stylesheet" href="styles/boot-overlay.css" />
        <link rel="stylesheet" href="styles/layout.css" />
        <link rel="stylesheet" href="styles/terminal.css" />
    </head>
    <body>
        <div class="scanlines" aria-hidden="true"></div>
        <div class="vignette" aria-hidden="true"></div>

        <div class="page-shell">

            <main class="body-grid">
                <!-- Left: Terminal-->
                <section class="col col-terminal" aria-label="Terminal">
                    <div id="terminal"></div>
                </section>

                <!-- Middle: Guestbook-->
                <section
                    class="col col-guestbook"
                    aria-label="Guestbook"
                    x-data="guestbookComponent()"
                >
                    <div class="gb-header">// guestbook</div>

                    <div class="gb-stream">
                        <template x-for="entry in entries" :key="entry.id">
                            <article class="gb-entry">
                                <div class="gb-entry-meta">
                                    <span
                                        class="gb-entry-name"
                                        x-text="entry.name"
                                    ></span>
                                    <span
                                        class="gb-entry-date"
                                        x-text="entry.date"
                                    ></span>
                                </div>
                                <p
                                    class="gb-entry-msg"
                                    x-text="entry.message"
                                    :class="{ 'c-dim': entry.pending }"
                                ></p>
                                <button
                                    class="gb-entry-like"
                                    @click="toggleLike(entry)"
                                    x-show="!entry.pending"
                                    :aria-label="'Like · ' + entry.likes"
                                >
                                    <span
                                        x-text="isLiked(entry.id) ? '▲' : '△'"
                                    ></span>
                                    <span x-text="entry.likes"></span>
                                </button>
                            </article>
                        </template>
                    </div>

                    <div class="gb-input-area">
                        <div class="gb-input-name-row">
                            <span
                                class="gb-input-name"
                                x-text="authorName"
                            ></span>
                            <button class="gb-reroll" @click="reroll()">
                                ⟳ reroll
                            </button>
                        </div>
                        <textarea
                            class="gb-textarea"
                            placeholder="leave a note..."
                            x-model="message"
                            @keydown="handleKeydown($event)"
                            :maxlength="200"
                            rows="2"
                        ></textarea>
                        <div class="gb-submit-row">
                            <span
                                class="gb-pending"
                                x-show="pending"
                                x-text="pendingMsg"
                            ></span>
                            <button
                                class="gb-submit"
                                @click="submit()"
                                x-show="!pending"
                                :disabled="message.trim().length < 3"
                            >
                                post ↵
                            </button>
                        </div>
                    </div>
                </section>

                <!-- Right: Dashboard-->
                <aside
                    class="col col-dashboard"
                    aria-label="Dashboard"
                    x-data="dashboardComponent()"
                    x-init="init()"
                >
                    <div class="db-section">
                        <div class="db-clock" x-text="clockTime"></div>
                        <div class="db-date-str" x-text="clockDate"></div>
                    </div>

                    <div class="db-section">
                        <div class="db-label">github</div>
                        <div class="db-row">
                            <span class="db-key">repos</span
                            ><span class="db-val" x-text="github.repos"></span>
                        </div>
                        <div class="db-row">
                            <span class="db-key">stars</span
                            ><span class="db-val" x-text="github.stars"></span>
                        </div>
                        <div class="db-row">
                            <span class="db-key">top lang</span
                            ><span
                                class="db-val"
                                x-text="github.topLang"
                            ></span>
                        </div>
                        <div class="db-row">
                            <span class="db-key">last push</span
                            ><span
                                class="db-val"
                                x-text="github.lastPush"
                            ></span>
                        </div>
                    </div>

                    <div class="db-section sb-section-heatmap">
                        <div class="db-label">contributions</div>
                        <div
                            class="heatmap-grid"
                            id="heatmap-grid"
                            aria-label="GitHub contribution heatmap"
                        ></div>
                    </div>

                    <div class="db-section">
                        <div class="db-label">status</div>
                        <div class="db-row">
                            <span class="db-key">discord</span>
                            <span class="db-val"
                                ><span
                                    :class="discordDot()"
                                    aria-hidden="true"
                                ></span
                                ><span x-text="discord"></span
                            ></span>
                        </div>
                        <div class="db-row">
                            <span class="db-key">homelab</span>
                            <span class="db-val" :class="homelabClass()"
                                ><span x-text="homelab.services"></span> svc ·
                                <span x-text="homelab.status"></span
                            ></span>
                        </div>
                    </div>

                    <div class="db-section">
                        <div class="db-label">now playing</div>
                        <div class="db-row">
                            <span class="db-val c-dim" x-show="!spotifyLine()"
                                >silence</span
                            >
                            <span
                                class="db-val"
                                style="font-size: var(--fs-9); text-align: left"
                                x-show="spotifyLine()"
                                x-text="spotifyLine()"
                            ></span>
                        </div>
                    </div>

                    <div class="db-section">
                        <div class="db-label">availability</div>
                        <div class="db-row">
                            <span class="db-key">open to</span>
                            <span class="db-val ok">collab</span>
                        </div>
                        <div class="db-row">
                            <span class="db-key">email</span>
                            <span class="db-val" style="font-size: var(--fs-9)">
                                <a
                                    href="mailto:alen@alenalex.me"
                                    style="
                                        color: var(--bl);
                                        text-decoration: none;
                                    "
                                    >alen@alenalex.me</a
                                >
                            </span>
                        </div>
                    </div>
                </aside>
            </main>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/animejs@3/lib/anime.min.js"></script>
        <script src="src/boot-overlay.js"></script>
        <script src="src/terminal.js"></script>
        <script src="src/guestbook.js"></script>
        <script src="src/dashboard.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"
            defer
        ></script>

        <script>
            mountLayout({ title: 'alen@alenalex.me: ~', activePage: 'home' });

            (function () {
                const el = document.getElementById("sb-clock");
                function tick() {
                    const n = new Date();
                    const pad = (v) => String(v).padStart(2, "0");
                    if (el)
                        el.textContent = `${pad(n.getUTCHours())}:${pad(n.getUTCMinutes())}:${pad(n.getUTCSeconds())} UTC`;
                }
                tick();
                setInterval(tick, 1000);
            })();

            (function () {
                function countToLevel(n) {
                    if (n === 0) return "h0";
                    if (n <= 3) return "h1";
                    if (n <= 6) return "h2";
                    if (n <= 10) return "h3";
                    return "h4";
                }

                const grid = document.getElementById("heatmap-grid");
                const now = new Date();

                for (let w = 12; w >= 0; w--) {
                    const col = document.createElement("div");
                    col.className = "heatmap-week";
                    for (let d = 0; d < 7; d++) {
                        const day = new Date(now);
                        day.setDate(now.getDate() - (w * 7 + (6 - d)));
                        const rng = Math.random();
                        const count =
                            rng < 0.35
                                ? 0
                                : rng < 0.55
                                  ? 1 + Math.floor(Math.random() * 3)
                                  : rng < 0.8
                                    ? 4 + Math.floor(Math.random() * 3)
                                    : 7 + Math.floor(Math.random() * 5);
                        const dot = document.createElement("div");
                        dot.className = `heatmap-dot ${countToLevel(count)}`;
                        const tip = document.createElement("div");
                        tip.className = "heatmap-tip";
                        tip.textContent = `${day.toISOString().slice(0, 10)} · ${count}`;
                        dot.appendChild(tip);
                        col.appendChild(dot);
                    }
                    grid.appendChild(col);
                }
            })();


            // ── Boot → Terminal ───────────────────────────────────
            // anime is loaded blocking in <head> so it's guaranteed available here.
            // sessionStorage.removeItem('boot-seen'); // ← uncomment to re-test overlay
            runBootOverlay(function () {
                runTerminal();
            });
        </script>
    </body>
</html>
