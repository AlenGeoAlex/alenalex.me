<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>now · Alen Alex</title>
        <meta name="description" content="So, by now, you know what about me, right? This page says what am I up to right now." />
        <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="shortcut icon" href="/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />
        <meta property="og:type" content="website">
        <meta property="og:title" content="now · Alen Alex">
        <meta property="og:description" content="So, by now, you know what about me, right? This page says what am I up to right now.">
        <meta property="og:url" content="https://alenalex.me">
        <meta property="og:image" content="https://assets.alenalex.me/assets/hotlink-ok/default_og.png">
        <meta property="og:site_name" content="now · Alen Alex">
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="now · Alen Alex">
        <meta name="twitter:description" content="So, by now, you know what about me, right? This page says what am I up to right now.">
        <meta name="twitter:image" content="https://assets.alenalex.me/assets/hotlink-ok/default_og.png">

        <link rel="stylesheet" href="styles/tokens.css" />
        <link rel="stylesheet" href="styles/base.css" />
        <link rel="stylesheet" href="styles/layout.css" />
        <link rel="stylesheet" href="styles/now.css" />
    </head>
    <body>
        <div class="scanlines" aria-hidden="true"></div>
        <div class="vignette" aria-hidden="true"></div>

        <div class="page-shell">
            <main class="now-main" x-data="nowComponent()" x-init="init()">
                <div class="now-shell">

                    <div class="now-header">
                        <div class="now-prompt">cat now.md</div>
                        <div class="now-title">Now.</div>
                        <div class="now-updated">last updated · June 2026</div>
                    </div>

                    <div class="now-section" :class="{ visible: visible }">
                        <div class="now-section-label">currently</div>
                        <div class="now-items">
                            <template x-for="item in currently" :key="item.label">
                                <div>
                                    <div class="now-item">
                                        <img class="now-item-icon" :src="item.icon" :alt="item.label" loading="lazy" @error="$el.style.visibility='hidden'" />
                                        <span x-show="item.href">
                                            <a :href="item.href" target="_blank" rel="noopener" x-text="item.label"></a>
                                        </span>
                                        <span x-show="!item.href" x-text="item.label"></span>
                                    </div>
                                    <div class="now-item-sub" x-show="item.sub" x-text="item.sub"></div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <div class="now-section" :class="{ visible: visible2 }">
                        <div class="now-section-label">on the horizon</div>
                        <div class="now-items">
                            <template x-for="item in horizon" :key="item.label">
                                <div class="now-item">
                                    <img class="now-item-icon" :src="item.icon" :alt="item.label" loading="lazy" @error="$el.style.visibility='hidden'" />
                                    <span x-show="item.href">
                                        <a :href="item.href" target="_blank" rel="noopener" x-text="item.label"></a>
                                    </span>
                                    <span x-show="!item.href" x-text="item.label"></span>
                                </div>
                            </template>
                        </div>
                    </div>

                    <div class="now-section" :class="{ visible: visible3 }">
                        <div class="now-section-label">outside the terminal</div>
                        <div class="now-text-items">
                            <template x-for="item in outside" :key="item">
                                <div class="now-text-item" x-text="item"></div>
                            </template>
                        </div>
                    </div>

                    <div class="now-section" :class="{ visible: visible4 }">
                        <div class="now-section-label">get in touch</div>
                        <div class="now-socials">
                            <template x-for="s in socials" :key="s.key">
                                <div class="now-social-row">
                                    <span class="now-social-key" x-text="s.key"></span>
                                    <span class="now-social-val">
                                        <a x-show="s.href" :href="s.href" :target="s.href && !s.href.startsWith('mailto') ? '_blank' : ''" :rel="s.href && !s.href.startsWith('mailto') ? 'noopener' : ''" x-text="s.val"></a>
                                        <span x-show="!s.href" x-text="s.val"></span>
                                    </span>
                                </div>
                            </template>
                        </div>
                    </div>

                    <div class="now-section" :class="{ visible: visible5 }">
                        <span class="now-prompt-final">$ <span class="cursor"></span></span>
                    </div>

                </div>
            </main>
        </div>

        <script src="src/config.js"></script>
        <script src="src/layout.js"></script>
        <script src="src/now.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js" defer></script>
        <script>
            mountLayout({ title: 'alen@alenalex.me: ~/now', activePage: 'now' });
        </script>
    </body>
</html>
