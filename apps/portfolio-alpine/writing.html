<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>writing · Alen Alex</title>
        <meta
            name="description"
            content="Writing by Alen Alex — backend systems, open source, and whatever else."
        />
        <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="shortcut icon" href="/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />
        <meta property="og:type" content="website">
        <meta property="og:title" content="writing · Alen Alex">
        <meta property="og:description" content="Writing by Alen Alex — backend systems, open source, and whatever else.">
        <meta property="og:url" content="https://alenalex.me">
        <meta property="og:image" content="https://assets.alenalex.me/assets/hotlink-ok/default_og.png">
        <meta property="og:site_name" content="writing · Alen Alex">
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="writing · Alen Alex">
        <meta name="twitter:description" content="Writing by Alen Alex — backend systems, open source, and whatever else.">
        <meta name="twitter:image" content="https://assets.alenalex.me/assets/hotlink-ok/default_og.png">

        <link rel="stylesheet" href="styles/tokens.css" />
        <link rel="stylesheet" href="styles/base.css" />
        <link rel="stylesheet" href="styles/layout.css" />
        <link rel="stylesheet" href="styles/writing.css" />
    </head>
    <body>
        <div class="scanlines" aria-hidden="true"></div>
        <div class="vignette" aria-hidden="true"></div>

        <div class="page-shell">
            <main
                class="writing-main"
                x-data="writingComponent()"
                x-init="init()"
                aria-label="Writing"
            >
                <div class="writing-shell">
                    <div class="writing-header">
                        <div class="writing-prompt">git log --all</div>
                        <div class="writing-meta">
                            <span
                                x-text="posts.filter(p => p.published).length"
                            ></span>
                            published
                            <span x-show="isPreview"
                                >&nbsp;·&nbsp;<span style="color: var(--warn)"
                                    >[PREVIEW ·
                                    <span x-text="previewSha"></span>]</span
                                ></span
                            >
                        </div>
                    </div>

                    <div
                        class="writing-preview-banner"
                        x-show="isPreview"
                        x-cloak
                    >
                        [PREVIEW] sha <span x-text="previewSha"></span> · drafts
                        visible · links carry this sha to the post page
                    </div>

                    <div
                        class="writing-filters"
                        x-show="!loading && !error"
                        x-cloak
                    >
                        <div class="wr-search-row">
                            <span class="wr-search-prompt">~/writing $</span>
                            <input
                                id="wr-search"
                                class="wr-search-input"
                                type="text"
                                placeholder="filter commits..."
                                spellcheck="false"
                                autocomplete="off"
                                x-model="query"
                                @input="onQueryInput()"
                            />
                            <span class="wr-search-hint" x-show="!query"
                                >/</span
                            >
                        </div>

                        <div class="wr-tags-row" x-show="allTags.length > 0">
                            <template x-for="tag in allTags" :key="tag">
                                <button
                                    class="wr-tag-pill"
                                    :class="{ active: activeTags.includes(tag) }"
                                    @click="toggleTag(tag)"
                                    x-text="'#' + tag"
                                ></button>
                            </template>
                        </div>

                        <div class="wr-filter-status" x-show="hasFilters">
                            <span
                                x-text="totalVisible + ' result' + (totalVisible === 1 ? '' : 's')"
                            ></span>
                            <button class="wr-clear" @click="clearFilters()">
                                × clear
                            </button>
                        </div>
                    </div>

                    <div class="writing-status" x-show="loading" x-cloak>
                        fetching posts<span class="cursor"></span>
                    </div>

                    <div
                        class="writing-status"
                        x-show="error && !loading"
                        x-cloak
                    >
                        <span style="color: var(--warn)" x-text="error"></span>
                    </div>

                    <div
                        class="writing-status"
                        x-show="!loading && !error && hasFilters && totalVisible === 0"
                        x-cloak
                    >
                        no commits match ·
                        <button class="wr-clear" @click="clearFilters()">
                            × clear filters
                        </button>
                    </div>

                    <div x-show="!loading && !error" x-cloak>
                        <template x-for="year in years" :key="year">
                            <div>
                                <div class="writing-year" x-text="year"></div>

                                <template
                                    x-for="post in grouped[year]"
                                    :key="post.slug"
                                >
                                    <div
                                        class="writing-row"
                                        :class="{
                                            draft: !post.published,
                                            open:  openSlug === post.slug
                                        }"
                                    >
                                        <div
                                            class="writing-row-head"
                                            @click="toggle(post)"
                                            :role="post.published || isPreview ? 'button' : 'presentation'"
                                            :tabindex="post.published || isPreview ? 0 : -1"
                                            :aria-expanded="openSlug === post.slug"
                                            @keydown.enter="toggle(post)"
                                            @keydown.space.prevent="toggle(post)"
                                        >
                                            <span
                                                class="wr-hash"
                                                x-text="post.published || isPreview ? post.hash : '██████'"
                                            ></span>
                                            <span
                                                class="wr-date"
                                                x-text="post.published || isPreview ? post.date : '████-██-██'"
                                            ></span>
                                            <span
                                                class="wr-icon"
                                                x-text="post.published || isPreview ? post.icon : '█'"
                                            ></span>
                                            <span
                                                class="wr-title"
                                                x-text="post.published || isPreview ? post.title : post.title.replace(/[^\s]/g, '█')"
                                            ></span>
                                            <span
                                                class="wr-chevron"
                                                x-show="post.published || isPreview"
                                                >›</span
                                            >
                                        </div>

                                        <!-- Expanded body -->
                                        <div class="writing-row-body">
                                            <p
                                                class="wr-excerpt"
                                                x-text="post.excerpt"
                                            ></p>
                                            <div class="wr-tags-inline">
                                                <template
                                                    x-for="tag in post.tags"
                                                    :key="tag"
                                                >
                                                    <button
                                                        class="wr-tag-pill small"
                                                        :class="{ active: activeTags.includes(tag) }"
                                                        @click.stop="toggleTag(tag)"
                                                        x-text="'#' + tag"
                                                    ></button>
                                                </template>
                                            </div>
                                            <a
                                                class="wr-read"
                                                :href="postHref(post)"
                                                x-text="post.published ? 'read post →' : '[DRAFT] preview post →'"
                                            ></a>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>

                    <div class="writing-cursor-line" x-show="!loading" x-cloak>
                        $ <span class="cursor"></span>
                    </div>
                </div>
            </main>
        </div>

        <script src="src/config.js"></script>
        <script src="src/layout.js"></script>
        <script src="src/writing.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"
            defer
        ></script>
        <script>
            mountLayout({
                title: "alen@alenalex.me: ~/writing",
                activePage: "writing",
            });
        </script>
    </body>
</html>
